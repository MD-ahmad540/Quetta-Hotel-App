<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Quetta Hotel Billing</title>
<style>
:root{--red:#b5121b;--deep:#780b12;--yellow:#ffc928;--cream:#fff8e5;--ink:#292323}*{box-sizing:border-box}body{margin:0;background:#fff8e9;color:var(--ink);font-family:Arial,sans-serif}.top{background:linear-gradient(120deg,var(--deep),var(--red));color:white;padding:20px 16px 16px;border-bottom:5px solid var(--yellow);animation:drop .55s ease}.top h1{margin:0;font-size:25px}.top p{margin:5px 0 0;color:#ffe7a0}.tabs{display:flex;gap:8px;padding:12px;position:sticky;top:0;background:#fff8e9;z-index:3}.tabs button,.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:bold;background:var(--red);color:white}.tabs button.active{background:var(--yellow);color:#4c2600}.wrap{padding:0 12px 25px}.panel{background:white;border:1px solid #f0d9a1;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px #5d310c12}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #f4ead3}.item:last-child{border:0}.name{font-weight:bold}.price{color:var(--red);font-weight:bold}.small{font-size:12px;color:#756b60}.qty{display:flex;align-items:center;gap:8px}.qty button{border:0;border-radius:8px;background:#ffedb1;padding:7px 11px;font-size:18px}.total{font-size:24px;font-weight:bold;color:var(--red)}input{padding:10px;border:1px solid #d9c69c;border-radius:9px;max-width:100%;width:100%;margin:5px 0}label{font-size:13px;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.editrow{display:grid;grid-template-columns:1fr 90px 42px;gap:6px;align-items:center;margin:8px 0}.editrow input{margin:0}.danger{background:#6d6d6d!important}.muted{background:#f5e7c5;color:#5c3b00}.hidden{display:none}.receipt{text-align:center}.receipt hr{border:0;border-top:1px dashed #888}.receiptline{display:flex;justify-content:space-between;padding:4px 0}@keyframes drop{from{transform:translateY(-12px);opacity:.5}to{transform:translateY(0);opacity:1}}@media print{.top,.tabs,.noprint{display:none!important}body{background:white}.panel{box-shadow:none;border:0}}
</style></head><body>
<header class="top"><h1>🍽 QUETTA HOTEL</h1><p>Billing & Sales Management</p></header>
<nav class="tabs noprint"><button class="active" onclick="show('billing',this)">Billing</button><button onclick="show('menu',this)">Menu & Prices</button><button onclick="show('reports',this)">Sales Report</button></nav>
<main class="wrap">
<section id="billing"><div class="panel"><h3>🧾 Select Items</h3><div id="items"></div></div><div class="panel"><h3>Current Order</h3><div id="cart"></div><p>Total: <span class="total" id="total">Rs. 0</span></p><div class="grid"><button class="btn muted" onclick="clearCart()">Clear</button><button class="btn" onclick="checkout()">Save & Print Slip</button></div></div></section>
<section id="menu" class="hidden"><div class="panel"><h3>✏️ Manage Menu & Prices</h3><p class="small">Yahan se item ka naam aur price khud change kar sakte hain.</p><div id="editor"></div><button class="btn" onclick="addItem()">+ Add New Item</button><button class="btn muted" onclick="saveMenu()">Save Changes</button></div></section>
<section id="reports" class="hidden"><div class="panel"><h3>📊 Sales Report</h3><label>From date</label><input type="date" id="from"><label>To date</label><input type="date" id="to"><button class="btn" onclick="renderReport()">Show Report</button><div id="report"></div><button class="btn muted" onclick="exportCSV()">Export CSV Backup</button></div></section>
</main>
<script>
const defaults=[['Simple Paratha',50],['Aloo Paratha',100],['Chai 100',100],['Chai 150',150],['Chai 200',200],['Chai 250',250],['Omelette / Anda',50],['Cold Drink',100]];
let menu=JSON.parse(localStorage.getItem('qh_menu')||'null')||defaults.map((x,i)=>({id:i+1,name:x[0],price:x[1]}));let cart={};let sales=JSON.parse(localStorage.getItem('qh_sales')||'[]');
function money(n){return 'Rs. '+Number(n||0).toLocaleString('en-PK')};function show(id,b){['billing','menu','reports'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='menu')renderEditor();if(id==='reports')renderReport()}
function renderItems(){document.getElementById('items').innerHTML=menu.map(m=>`<div class="item"><div><div class="name">${esc(m.name)}</div><div class="price">${money(m.price)}</div></div><div class="qty"><button onclick="change(${m.id},-1)">−</button><b>${cart[m.id]||0}</b><button onclick="change(${m.id},1)">+</button></div></div>`).join('')}
function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];renderItems();renderCart()};function total(){return menu.reduce((s,m)=>s+(cart[m.id]||0)*Number(m.price),0)}
function renderCart(){let rows=menu.filter(m=>cart[m.id]);document.getElementById('cart').innerHTML=rows.length?rows.map(m=>`<div class="receiptline"><span>${esc(m.name)} × ${cart[m.id]}</span><b>${money(m.price*cart[m.id])}</b></div>`).join(''):'<p class="small">No items selected yet.</p>';document.getElementById('total').textContent=money(total())}
function clearCart(){cart={};renderItems();renderCart()};function checkout(){if(!total()){alert('Please select items first.');return}let order={date:new Date().toISOString(),items:menu.filter(m=>cart[m.id]).map(m=>({name:m.name,qty:cart[m.id],price:Number(m.price)})),total:total()};sales.push(order);localStorage.setItem('qh_sales',JSON.stringify(sales));let w=window.open('','_blank');let html=`<html><head><title>Quetta Hotel Slip</title><style>body{font:14px monospace;width:58mm;margin:4mm}h3,p{text-align:center;margin:5px}hr{border:0;border-top:1px dashed}div{display:flex;justify-content:space-between;margin:5px 0}</style></head><body><h3>QUETTA HOTEL</h3><p>Customer Token / Receipt</p><hr>${order.items.map(i=>`<div><span>${esc(i.name)} x${i.qty}</span><b>${money(i.qty*i.price)}</b></div>`).join('')}<hr><div><b>TOTAL</b><b>${money(order.total)}</b></div><p>${new Date(order.date).toLocaleString()}</p><hr><p>Thank you!</p><script>window.onload=()=>window.print()<\/script></body></html>`;if(w){w.document.write(html);w.document.close()}else alert('Order saved. Allow popups to print receipt.');clearCart()}
function renderEditor(){document.getElementById('editor').innerHTML=menu.map(m=>`<div class="editrow"><input id="n${m.id}" value="${esc(m.name)}"><input id="p${m.id}" type="number" min="0" value="${m.price}"><button class="btn danger" onclick="removeItem(${m.id})">×</button></div>`).join('')}
function saveMenu(){menu=menu.map(m=>({...m,name:document.getElementById('n'+m.id).value.trim()||m.name,price:Math.max(0,Number(document.getElementById('p'+m.id).value)||0)}));localStorage.setItem('qh_menu',JSON.stringify(menu));renderItems();renderCart();renderEditor();alert('Menu and prices saved!')}
function addItem(){let id=Date.now();menu.push({id,name:'New Item',price:0});localStorage.setItem('qh_menu',JSON.stringify(menu));renderEditor()};function removeItem(id){if(confirm('Delete this item?')){menu=menu.filter(m=>m.id!==id);delete cart[id];localStorage.setItem('qh_menu',JSON.stringify(menu));renderEditor();renderItems();renderCart()}}
function renderReport(){let f=document.getElementById('from').value,t=document.getElementById('to').value;let list=sales.filter(s=>(!f||s.date.slice(0,10)>=f)&&(!t||s.date.slice(0,10)<=t));let sum=list.reduce((a,s)=>a+s.total,0);let count={};list.forEach(s=>s.items.forEach(i=>count[i.name]=(count[i.name]||0)+i.qty));document.getElementById('report').innerHTML=`<h3>Sales Total: <span class="price">${money(sum)}</span></h3><p>Paid orders: ${list.length}</p><h4>Item-wise sales</h4>${Object.entries(count).map(([n,q])=>`<div class="receiptline"><span>${esc(n)}</span><b>${q}</b></div>`).join('')||'<p class="small">No sales in selected dates.</p>'}<h4>Order History</h4>${list.slice().reverse().map(s=>`<div class="receiptline"><span>${new Date(s.date).toLocaleString()}</span><b>${money(s.total)}</b></div>`).join('')}`}
function exportCSV(){let rows=[['Date','Item','Quantity','Unit Price','Line Total']];sales.forEach(s=>s.items.forEach(i=>rows.push([s.date,i.name,i.qty,i.price,i.qty*i.price])));let csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='Quetta-Hotel-Sales.csv';a.click()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}renderItems();renderCart();
</script></body></html>
